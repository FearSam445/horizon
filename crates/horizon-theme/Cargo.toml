[package]
name = "horizon-theme"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Horizon's design tokens, fonts and icons, shared by the launcher, the website and the game's menus"

[dependencies]
# std::fs, in memory in the browser build (web/).
horizon-fs = { path = "../../web/fs" }
# std::time, with a clock in the browser build (web/).
web-time = "1.1"
