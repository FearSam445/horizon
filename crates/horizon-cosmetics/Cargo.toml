[package]
name = "horizon-cosmetics"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Cosmetic items drawn on players by Horizon clients: the item format, attachment to the player model's bones, simple animations, and what other players wear (fetched and cached)"

[dependencies]
horizon-addresses = { path = "../horizon-addresses" }
base64 = "0.22"
glam = "0.30"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
horizon-web-ureq = { path = "../../web/shims/ureq" }

[lints]
workspace = true
