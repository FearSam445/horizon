[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
# std::thread, inline in the browser build's one thread (web/).
horizon-thread = { path = "../../web/thread" }
# std::fs, in memory in the browser build (web/).
horizon-fs = { path = "../../web/fs" }
# SystemTime::now, also in the browser build (web/).
horizon-clock = { path = "../../web/clock" }
# std::time, with a clock in the browser build (web/).
web-time = "1.1"
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The page's game canvas (window.rs).
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
horizon-web-arboard = { path = "../../web/shims/arboard" }

[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

[features]
controllers = []

[lints]
workspace = true
