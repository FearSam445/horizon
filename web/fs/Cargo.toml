[package]
name = "horizon-fs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "std::fs on the desktop; in the browser build an in-memory file system with read-only zip mounts and packed files"
publish = false

[dependencies]
# Packed files (add_packed): inflated when the game opens them.
miniz_oxide = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
web-time = "1.1"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
