[package]
name = "horizon-fs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "std::fs on the desktop; in the browser build an in-memory file system with read-only zip mounts"
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
web-time = "1.1"
