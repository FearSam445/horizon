<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Horizon</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
  /* The game asks winit for a desktop window's size, which winit writes on the canvas as
     inline pixels: !important keeps it the page's size (iPad Safari's 100vh counts the
     toolbars, so the canvas fills the page with position: fixed instead). */
  canvas._eaglercraftX_canvas_element { display: block; position: fixed; inset: 0;
    width: 100% !important; height: 100% !important; min-width: 0 !important; min-height: 0 !important;
    max-width: none !important; max-height: none !important; margin: 0; outline: none; touch-action: none; }
  #horizon-status { position: fixed; inset: auto 0 40% 0; text-align: center; color: #e8e8ea;
    font: 16px/1.5 system-ui, sans-serif; pointer-events: none; white-space: pre-line; }
  #horizon-status .bar { width: 240px; height: 4px; margin: 12px auto 0; background: #2a2f3a; border-radius: 2px; overflow: hidden; }
  #horizon-status .bar > i { display: block; height: 100%; width: 0; background: #f0795a; transition: width .2s; }
  #horizon-files { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px));
    box-sizing: border-box; padding: 24px; border-radius: 12px; background: #161a22; color: #e8e8ea;
    font: 15px/1.5 system-ui, sans-serif; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #horizon-files .title { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  #horizon-files p { margin: 0 0 16px; color: #c9cbd1; }
  #horizon-files b { color: #e8e8ea; }
  #horizon-files .button { display: inline-block; padding: 10px 18px; border-radius: 999px; background: #f0795a; color: #16110f;
    font-weight: 600; cursor: pointer; }
  #horizon-files .link { margin-left: 12px; background: none; border: 0; color: #9aa0ad; font: inherit; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<canvas class="_eaglercraftX_canvas_element" id="horizon-canvas" tabindex="0"></canvas>
<div id="horizon-status">Starting Horizon…<div class="bar"><i></i></div></div>

<script>
// Browsers (an iPad's above all) keep a page's sound off until the player
// touches or types: the game's audio contexts are resumed on the first press. It runs before the
// game's glue, which keeps the AudioContext it finds when it loads.
(function () {
  var Native = window.AudioContext || window.webkitAudioContext;
  if (!Native) return;
  var contexts = window.horizonAudioContexts = [];
  function Tracked(options) {
    var context = new Native(options);
    contexts.push(context);
    return context;
  }
  Tracked.prototype = Native.prototype;
  try { Object.setPrototypeOf(Tracked, Native); } catch (e) {}
  window.AudioContext = Tracked;
  function wake() {
    contexts.forEach(function (c) {
      if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(function () {});
    });
  }
  ['pointerdown', 'touchend', 'keydown', 'mousedown'].forEach(function (type) {
    window.addEventListener(type, wake, true);
  });
})();
</script>
