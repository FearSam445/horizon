[package]
name = "horizon-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon in a browser page: the game built for wasm32, started by web/build.py's single HTML file"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Sound plays through Web Audio (cpal's web host); controllers and Horizon's extras stay out.
horizon-client = { path = "../../crates/horizon-client", default-features = false, features = ["audio"] }
log = "0.4"
horizon-fs = { path = "../fs" }
horizon-thread = { path = "../thread" }
horizon-threads = { path = "../../crates/horizon-threads" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["console"] }
js-sys = "0.3.106"
# The shared atlas's upload straight to WebGL (webgl_upload.rs): wgpu's GL backend and its GL calls.
wgpu = { version = "30.0.1", default-features = false, features = ["webgl"] }
glow = "0.17"

[lints]
workspace = true
