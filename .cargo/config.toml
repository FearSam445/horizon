# `cargo xtask …` runs the repository's task crate, so the commands in docs/perf-platform.md and
# web/perf/README.md work as written. `cargo run -p xtask -- …` stays equivalent.
[alias]
xtask = "run --package xtask --"

# The browser build (web/): getrandom reads the browser's crypto.getRandomValues, and the
# stack is 8 MiB, as a desktop thread's, instead of wasm's 1 MiB: the renderer's and the
# game's large structs overflowed it (the page crashed with SEGV_ACCERR). simd128: wasm's
# 128-bit vectors, which LLVM vectorizes the noise, lighting and meshing loops with (Safari
# since 16.4, Chrome since 91).
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'link-arg=-zstack-size=8388608', '-C', 'target-feature=+simd128']
